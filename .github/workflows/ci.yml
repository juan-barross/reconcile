name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instala dependências
        run: uv sync --locked

      - name: Lint Python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Testes Python
        run: uv run pytest -q

      - name: Pipeline na amostra (carga, auditoria, dbt build)
        run: uv run reconcile --amostra tudo

      - name: Lint SQL
        run: uv run sqlfluff lint dbt/models dbt/tests departamentos
