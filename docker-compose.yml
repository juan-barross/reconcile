# Painel opcional. Rode `uv run reconcile tudo` antes: o Metabase só lê o arquivo.
services:
  metabase:
    build: docker/metabase
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data:ro
      - metabase-app:/home/metabase/app-db
    environment:
      MB_DB_FILE: /home/metabase/app-db/metabase.db
    restart: unless-stopped

volumes:
  metabase-app:
