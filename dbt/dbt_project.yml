name: reconcile
version: "0.1.0"
config-version: 2
profile: reconcile

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Último dia com volume normal de pedidos (ver docs/contrato_de_metricas.md).
  fim_observacao: "2018-08-31"

flags:
  require_explicit_package_overrides_for_builtin_materializations: true

models:
  reconcile:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
