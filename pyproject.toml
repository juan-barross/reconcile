[project]
name = "reconcile"
version = "0.1.0"
description = "Fonte única de verdade para o funil de crescimento da Olist"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.14.0",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "dbt-metricflow[duckdb]>=0.15.0",
    "duckdb>=1.5.6",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
reconcile = "reconcile.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "sqlfluff>=4.4.0",
    "sqlfluff-templater-dbt>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconcile"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
